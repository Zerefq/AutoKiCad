<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoKiCad — от монтажа к схеме</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">⚡</span> AutoKiCad <span class="sub">монтаж → схема</span></div>
    <nav class="tabs">
      <button data-tab="board" class="active">Монтаж</button>
      <button data-tab="split">Монтаж + схема</button>
      <button data-tab="sch">Схема</button>
    </nav>
    <div class="actions">
      <button id="btnNew">Новый</button>
      <button id="btnOpen">Открыть</button>
      <button id="btnSave">Сохранить</button>
      <div class="dropdown">
        <button id="btnExamples">Примеры ▾</button>
        <div class="menu" id="examplesMenu"></div>
      </div>
      <div class="dropdown">
        <button id="btnExport" class="primary">Экспорт ▾</button>
        <div class="menu">
          <button data-export="kicadzip"><b>KiCad</b> — готовый проект (.zip)<small>Проект + схема + библиотека символов. Распакуйте и откройте .kicad_pro</small></button>
          <button data-export="kicad"><b>KiCad</b> — только схема (.kicad_sch)<small>Открывается в KiCad 8–10, импортируется в EasyEDA Pro</small></button>
          <button data-export="easyeda"><b>EasyEDA Standard</b> — исходник (.json)<small>Документ → Открыть → EasyEDA Source</small></button>
          <button data-export="net"><b>Netlist</b> KiCad (.net)<small>Список соединений для платы</small></button>
          <button data-export="bom"><b>BOM</b> — перечень элементов (.csv)<small>Одинаковые детали одной строкой, с корпусом и номером LCSC. Открывается в Excel</small></button>
          <hr>
          <button data-export="png"><b>PNG</b> — картинка схемы</button>
          <button data-export="svg"><b>SVG</b> — картинка схемы (векторная)</button>
          <button data-export="print"><b>Печать / PDF</b><small>В окне печати выберите «Сохранить как PDF»</small></button>
          <hr>
          <button data-export="project"><b>Проект</b> AutoKiCad (.json)</button>
        </div>
      </div>
    </div>
  </header>
  <main>
    <aside class="palette" id="palette"></aside>
    <section class="stage">
      <svg id="board" class="canvas"></svg>
      <svg id="sch" class="canvas sch" hidden></svg>
      <div class="pane-label pl-board">Макетная плата</div>
      <div class="pane-label pl-sch">Схема — строится автоматически</div>
      <div class="hint" id="hint" hidden></div>
      <div class="zoombar">
        <button id="zoomOut" title="Отдалить">−</button>
        <button id="zoomFit" title="Вписать">⤢</button>
        <button id="zoomIn" title="Приблизить">+</button>
      </div>
    </section>
    <aside class="inspector" id="inspector"></aside>
  </main>
  <input type="file" id="fileInput" accept=".json" hidden>
  <div id="tooltip" hidden></div>
  <div id="toast"></div>

  <script src="js/util.js"></script>
  <script src="js/components.js"></script>
  <script src="js/examples.js"></script>
  <script src="js/easyeda-lib.js"></script>
  <script src="js/netlist.js"></script>
  <script src="js/schematic.js"></script>
  <script src="js/schview.js"></script>
  <script src="js/export-kicad.js"></script>
  <script src="js/export-easyeda.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
  <script>window.app = new AK.App();</script>
</body>
</html>
